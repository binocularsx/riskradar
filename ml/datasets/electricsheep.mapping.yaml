# Risk Radar dataset mapping (D81). Written by `evaluate_dataset.py suggest`.
# Read every field before running: a wrong sender or label column makes every
# figure meaningless while looking plausible. Then set `reviewed: true`.
# NOTE: no incident column: fraud rows of one customer (and type) within 24 hours count as one incident
# NOTE: amounts are multiplied by 100 into minor units (kobo, cents); set `scale: 1` if already minor
# NOTE: no approval/decline column: every row is treated as approved, so decline-based measurements and the card-testing rule cannot fire
# NOTE: `transaction_type` values read as credits: ['deposit']
# NOTE: 17 other numeric columns are offered as `native_features` for the comparison arm only; delete any that are derived from the label or from the future
dataset: ElectricSheep Nigerian transactions
reviewed: true
fields:
  label:
    column: is_fraud
    positive:
    - true
  fraud_type:
    column: fraud_type
  incident:
    derive:
      by: customer
      gap_hours: 24
  timestamp:
    column: timestamp
    timezone: Africa/Lagos
  amount:
    column: amount_ngn
    scale: 100
  account:
    column: sender_account
  beneficiary:
    column: receiver_account
  device:
    column: device_hash
  channel:
    column: payment_channel
    values:
      USSD: USSD
      Bank Transfer: API
      Mobile App: MOBILE_APP
      Card: POS
    default: API
  auth_result:
    constant: APPROVED
  instrument:
    column: transaction_type
    values:
      deposit: ACCOUNT_TRANSFER
      payment: ACCOUNT_TRANSFER
      withdrawal: CASH
      transfer: ACCOUNT_TRANSFER
    default: ACCOUNT_TRANSFER
  direction:
    column: transaction_type
    values:
      deposit: INBOUND
      payment: OUTBOUND
      withdrawal: OUTBOUND
      transfer: OUTBOUND
    default: OUTBOUND
  region:
    column: location
  merchant_category:
    column: merchant_category
native_features:
# Reviewed 17 Sep 2026: kept only columns computable from the row and its past.
# Dropped user_txn_count_total, user_avg_txn_amt, user_std_txn_amt, device_seen_count,
# ip_seen_count, is_device_shared, is_ip_shared, avg_gap_between_txns (whole-file
# aggregates: they read the future) and time_since_last_transaction (negative, unexplained).
- txn_hour
- is_weekend
- is_salary_week
- is_night_txn
- txn_count_last_1h
- txn_count_last_24h
- total_amount_last_1h
- time_since_last
ignore:
  spending_deviation_score: 'somebody else''s score or flag (D10f): never an input'
  velocity_score: 'somebody else''s score or flag (D10f): never an input'
  geo_anomaly_score: 'somebody else''s score or flag (D10f): never an input'
  geospatial_velocity_anomaly: 'somebody else''s score or flag (D10f): never an input'
  merchant_fraud_rate: 'somebody else''s score or flag (D10f): never an input'
  channel_risk_score: 'somebody else''s score or flag (D10f): never an input'
  persona_fraud_risk: 'somebody else''s score or flag (D10f): never an input'
  location_fraud_risk: 'somebody else''s score or flag (D10f): never an input'
